<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi mẹ yêu 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --w:min(84vw,380px,56vh);--k:1.2;
  --bg1:#fff6f3;--bg2:#f8d3dc;--hint:#a3425f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#41212f;--bg2:#1d0e17;--hint:#f4c6d3}}
:root[data-theme="dark"]{--bg1:#41212f;--bg2:#1d0e17;--hint:#f4c6d3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 42%,var(--bg1),var(--bg2) 88%);background-color:var(--bg2);
  font-family:'Quicksand','Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.scene{position:relative;height:100%;display:grid;place-items:center;overflow:hidden}

/* flowers */
.flora{position:fixed;width:clamp(150px,38vw,310px);aspect-ratio:1;pointer-events:none;z-index:0;
  filter:drop-shadow(0 5px 7px rgba(150,60,90,.2));animation:sway 7s ease-in-out infinite alternate}
.tr,.bl{width:clamp(110px,26vw,220px)}
.tl{top:0;left:0;transform-origin:0 0}
.tr{top:0;right:0;transform-origin:100% 0;animation-delay:-2s}
.bl{bottom:0;left:0;transform-origin:0 100%;animation-delay:-4s}
.br{bottom:0;right:0;transform-origin:100% 100%;animation-delay:-1s}
@keyframes sway{from{rotate:-1.6deg}to{rotate:1.6deg}}

/* petals */
#petals{position:fixed;inset:0;pointer-events:none;z-index:1}
.petal{position:absolute;top:-5vh;width:var(--s);height:calc(var(--s)*1.5);opacity:.8;
  background:linear-gradient(135deg,#fff,#f6b2c6);border-radius:80% 0 80% 0;
  animation:fall var(--d) linear var(--dl) infinite}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(600deg)}}

/* envelope */
.stage{position:relative;z-index:2;width:var(--w);height:calc(var(--w)*.68);perspective:1100px;cursor:pointer;
  animation:bob 4.5s ease-in-out infinite;outline-offset:14px;border-radius:8px}
.stage.open{animation-play-state:paused;cursor:default}
@keyframes bob{50%{transform:translateY(-8px)}}
.back,.pocket,.flap{position:absolute}
.back{inset:0;z-index:1;border-radius:calc(var(--w)*.02);background:linear-gradient(#f2c9d1,#e6aebb);
  box-shadow:0 14px 26px rgba(140,50,80,.28)}
.pocket{inset:0;z-index:4;filter:drop-shadow(0 -1px 2px rgba(150,60,80,.3))}
.pocket i{position:absolute;inset:0}
.pocket i:nth-child(1){clip-path:polygon(0 0,50% 56%,0 100%);background:linear-gradient(90deg,#f8d6dd,#fbe4e8);border-radius:0 0 0 calc(var(--w)*.02)}
.pocket i:nth-child(2){clip-path:polygon(100% 0,50% 56%,100% 100%);background:linear-gradient(270deg,#f8d6dd,#fbe4e8);border-radius:0 0 calc(var(--w)*.02) 0}
.pocket i:nth-child(3){clip-path:polygon(0 100%,50% 56%,100% 100%);background:linear-gradient(#fdeef0,#f9dce2);border-radius:0 0 calc(var(--w)*.02) calc(var(--w)*.02)}
.to{position:absolute;left:0;right:0;bottom:11%;text-align:center;font:700 calc(var(--w)*.075)/1 'Dancing Script','Segoe Script','Brush Script MT',cursive;color:#b8456a}
.flap{left:0;top:0;width:100%;height:56%;z-index:5;transform-origin:50% 0;clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(#fae3e7,#f1c1cb);transition:transform .35s,opacity 1s ease 2.1s,translate 1.4s ease 2.1s}
.seal{position:absolute;z-index:6;left:50%;top:56%;width:calc(var(--w)*.13);aspect-ratio:1;translate:-50% -50%;pointer-events:none;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#ef8aa2,#cf5573);box-shadow:0 2px 5px rgba(120,30,60,.35);
  display:grid;place-items:center;color:#fff;font:calc(var(--w)*.06)/1 sans-serif}
.seal::before{content:"♥"}
.back,.pocket{transition:opacity 1s ease 2.1s,translate 1.4s ease 2.1s}
@media (hover:hover){.stage:not(.open):hover .flap{transform:rotateX(16deg)}}
.open .flap{animation:flap .9s both;opacity:0;translate:0 calc(var(--w)*.22)}
.open .seal{animation:pop .35s ease-out both}
@keyframes flap{
  0%{transform:rotateX(0);z-index:5;background:linear-gradient(#fae3e7,#f1c1cb);animation-timing-function:ease-in}
  50%{transform:rotateX(90deg);z-index:5;background:linear-gradient(#fae3e7,#f1c1cb)}
  50.1%{transform:rotateX(90deg);z-index:2;background:linear-gradient(#e7a7b4,#f2c8d0);animation-timing-function:ease-out}
  100%{transform:rotateX(180deg);z-index:2;background:linear-gradient(#e7a7b4,#f2c8d0)}
}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.open .back,.open .pocket{opacity:0;translate:0 calc(var(--w)*.22)}

/* letter */
.letter{--lw:calc(var(--w)*.88);position:absolute;z-index:3;left:50%;top:50%;translate:-50% -50%;transform:scale(.38);
  width:var(--lw);height:calc(var(--lw)*1.7)}
.paper{position:relative;z-index:1;width:100%;height:100%;box-sizing:border-box;padding:calc(var(--lw)*.07);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(#fffdf8,#fff5ea);border-radius:calc(var(--lw)*.016);box-shadow:0 10px 28px rgba(120,40,70,.25);
  font-size:calc(var(--lw)*.0477);line-height:1.7;color:#68414e}
.letter .mini{width:calc(var(--lw)*.09);aspect-ratio:1;flex:none}
.letter h1{margin:.3em 0 .55em;font:700 1.72em/1.25 'Dancing Script','Segoe Script','Brush Script MT',cursive;color:#b8456a;text-wrap:balance}
.letter p{margin:0;font-weight:500}
.letter .sign{margin-top:.9em;font:700 1.5em/1.4 'Dancing Script','Segoe Script','Brush Script MT',cursive;color:#b8456a}
.letter .photo{flex:none;width:calc(var(--lw)*.46);margin:1.1em 0 0;padding:calc(var(--lw)*.014);background:#fff;border-radius:3px;
  box-shadow:0 4px 12px rgba(120,40,70,.22);rotate:-2deg}
.letter .photo img{display:block;width:100%;height:auto;border-radius:2px}
.open .letter{animation:reveal 3s linear .75s both}
@keyframes reveal{
  0%{transform:translateY(0) scale(.38) rotate(0);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  40%{transform:translateY(calc(var(--w)*-.38)) scale(.6) rotate(-2deg)}
  48%{transform:translateY(calc(var(--w)*-.38)) scale(.6) rotate(-2deg);animation-timing-function:cubic-bezier(.45,0,.2,1)}
  100%{transform:translateY(0) scale(var(--k)) rotate(0)}
}
/* after the reveal: a normal, scrollable card at full size */
.read .scene{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.read .stage{width:auto;height:auto;margin:auto;cursor:pointer}
.read .letter{--lw:calc(var(--w)*.88*var(--k));position:relative;left:auto;top:auto;translate:none;transform:none;animation:none}
.read .back,.read .flap,.read .pocket,.read .seal,.read .hint{visibility:hidden}

/* flowers springing up from behind the letter */
.bloom{position:absolute;inset:0;z-index:0;pointer-events:none;visibility:hidden}
.read .bloom{visibility:visible}
.bf{position:absolute;translate:-50% -50%;aspect-ratio:1;overflow:visible;opacity:0;filter:drop-shadow(0 3px 4px rgba(120,40,70,.22))}
.read .bf{animation:spring .95s cubic-bezier(.34,1.56,.64,1) var(--dl) both,idle 4s ease-in-out 1.7s infinite alternate}
@keyframes spring{
  0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15) rotate(-40deg)}
  35%{opacity:1}
  100%{opacity:1;transform:none}
}
@keyframes idle{from{rotate:-4deg}to{rotate:4deg}}
.tip{position:fixed;z-index:3;left:50%;bottom:max(8px,env(safe-area-inset-bottom));translate:-50% 0;margin:0;white-space:nowrap;
  font:600 13px 'Quicksand','Segoe UI',system-ui,sans-serif;color:var(--hint);opacity:0;pointer-events:none;transition:opacity .4s}
.read .tip{opacity:.85;transition:opacity .6s ease 1.7s}

/* folding back into the envelope */
.closing .back{opacity:1;translate:0 0;transition:opacity .7s ease .1s,translate .9s ease .1s}
.closing .flap{animation:flapclose .9s 2.05s both;opacity:1;translate:0 0;transition:opacity .7s ease .1s,translate .9s ease .1s}
.closing .pocket{opacity:1;translate:0 0;transition:opacity .5s ease .95s,translate .9s ease .85s}
.closing .letter{animation:unreveal 2.4s linear both}
.closing .seal{animation:unpop .4s ease-out 2.75s both}
.closing .bloom{visibility:visible}
.closing .bf{animation:retract .45s ease-in both}
@keyframes unreveal{
  0%{transform:translateY(0) scale(var(--k)) rotate(0);animation-timing-function:cubic-bezier(.45,0,.2,1)}
  45%{transform:translateY(calc(var(--w)*-.38)) scale(.6) rotate(-2deg)}
  50%{transform:translateY(calc(var(--w)*-.38)) scale(.6) rotate(-2deg);animation-timing-function:cubic-bezier(.5,0,.3,1)}
  100%{transform:translateY(0) scale(.38) rotate(0)}
}
@keyframes flapclose{
  0%{transform:rotateX(180deg);z-index:2;background:linear-gradient(#e7a7b4,#f2c8d0);animation-timing-function:ease-in}
  50%{transform:rotateX(90deg);z-index:2;background:linear-gradient(#e7a7b4,#f2c8d0)}
  50.1%{transform:rotateX(90deg);z-index:5;background:linear-gradient(#fae3e7,#f1c1cb);animation-timing-function:ease-out}
  100%{transform:rotateX(0);z-index:5;background:linear-gradient(#fae3e7,#f1c1cb)}
}
@keyframes unpop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes retract{from{opacity:1;transform:none}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15) rotate(30deg)}}

/* hint */
.hint{position:absolute;left:50%;top:calc(100% + var(--w)*.14);translate:-50% 0;margin:0;white-space:nowrap;padding:.5em 1.1em;border-radius:999px;
  background:#fff;color:#b8456a;box-shadow:0 4px 14px rgba(150,60,90,.25);
  font-weight:700;font-size:max(15px,calc(var(--w)*.052));animation:nudge 1.6s ease-in-out infinite;transition:opacity .4s}
.hint::before{content:"";position:absolute;left:50%;top:-.3em;width:.7em;height:.7em;background:#fff;rotate:45deg;translate:-50% 0;border-radius:2px}
.open .hint{opacity:0;animation:none}
@keyframes nudge{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.stage,.flora,.hint{animation:none}.petal{display:none}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

  </linearGradient>

  </symbol>
</defs></svg>

<i id="probe" style="position:absolute;visibility:hidden;width:var(--w);height:0"></i>
<main class="scene">
  <svg class="flora tl" viewBox="0 0 300 300" aria-hidden="true"><use href="#cluster" width="300" height="300"/></svg>
  <svg class="flora tr" viewBox="0 0 300 300" aria-hidden="true"><g transform="translate(300 0) scale(-1 1)"><use href="#cluster" width="300" height="300"/></g></svg>
  <svg class="flora bl" viewBox="0 0 300 300" aria-hidden="true"><g transform="translate(0 300) scale(1 -1)"><use href="#cluster" width="300" height="300"/></g></svg>
  <svg class="flora br" viewBox="0 0 300 300" aria-hidden="true"><g transform="translate(300 300) scale(-1 -1)"><use href="#cluster" width="300" height="300"/></g></svg>
  <div id="petals" aria-hidden="true"></div>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Mở thư gửi mẹ" aria-expanded="false">
    <div class="back"></div>

    <section class="letter"><div class="bloom" aria-hidden="true"></div><div class="paper">
      <svg class="mini" aria-hidden="true"><use href="#lily" width="100%" height="100%" style="color:#fbc4d4"/></svg>

</main>
<p class="tip">Chạm vào thư để gấp lại 💌</p>

<script>
(function(){
  var s=document.getElementById('stage'),L=s.querySelector('.letter'),B=document.body,
      scene=document.querySelector('.scene'),probe=document.getElementById('probe'),state='closed';

  function openLetter(){
    state='opening';
    s.classList.add('open');
    s.setAttribute('aria-expanded','true');
    s.setAttribute('aria-label','Gấp thư lại');
  }
  function closeLetter(){
    state='closing';
    scene.scrollTop=0;
    B.classList.remove('read');
    s.classList.add('closing');
    setTimeout(function(){
      s.classList.remove('open','closing');
      s.setAttribute('aria-expanded','false');
      s.setAttribute('aria-label','Mở thư gửi mẹ');
      state='closed';
    },3300);
  }
  function toggle(){
    if(state==='closed')openLetter();
    else if(state==='open')closeLetter();
  }
  s.addEventListener('click',toggle);
  s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  L.addEventListener('animationend',function(e){
    if(e.animationName==='reveal'&&state==='opening'){B.classList.add('read');state='open';}
  });

  function fit(){
    var w=Math.min(innerWidth*.94,460,innerHeight*.86/1.7);
    document.documentElement.style.setProperty('--k',(w/(.88*probe.offsetWidth)).toFixed(3));
  }
  fit();addEventListener('resize',fit);

  /* colourful flowers: [x%, y%, size, type (l=lily, b=blossom), colour, delay] */
  var F=[[10,1,.30,'l','#ff9a62',0],[30,-1,.20,'b','#ffd34d',.12],[50,0,.26,'l','#c9a8f5',.05],[71,-1,.19,'b','#ff7fa8',.17],[91,1,.30,'l','#ff7a8a',.08],
         [-1,22,.20,'b','#8ec5ff',.2],[101,30,.19,'b','#ffb454',.22],[0,52,.24,'l','#ffd96b',.14],[100,58,.22,'l','#f6a3d0',.18],
         [-1,80,.18,'b','#b79cf5',.25],[101,84,.20,'b','#ff7fa8',.28],
         [14,98,.22,'l','#ffb08a',.3],[38,99,.17,'b','#ffc83d',.34],[62,99,.18,'b','#8ec5ff',.32],[86,98,.22,'l','#d6b3ff',.3]];
  var html='';
  F.forEach(function(f){
    var dx=50-f[0],dy=(50-f[1])*1.7,m=Math.hypot(dx,dy)||1,S=f[2];
    html+='<svg class="bf" viewBox="-140 -140 280 280" style="left:'+f[0]+'%;top:'+f[1]+'%;width:calc(var(--lw)*'+S+');'+
      '--dx:calc(var(--lw)*'+(dx/m*S*.7).toFixed(3)+');--dy:calc(var(--lw)*'+(dy/m*S*.7).toFixed(3)+');--dl:'+(f[5]+.1)+'s">'+
      '<use href="#leaf" transform="rotate(-25) scale(.8)"/><use href="#leaf" transform="rotate(205) scale(.8)"/>'+
      '<use href="'+(f[3]==='l'?'#lily':'#blos')+'" x="-100" y="-100" width="200" height="200" style="color:'+f[4]+'"/></svg>';
  });
  L.querySelector('.bloom').innerHTML=html;

  var box=document.getElementById('petals');
  for(var i=0;i<14;i++){
    var r=Math.random(),p=document.createElement('span');
    p.className='petal';
    p.style.cssText='left:'+(Math.random()*100)+'%;--s:'+(8+r*10)+'px;--d:'+(10+Math.random()*9)+'s;--dl:-'+(Math.random()*16)+'s;--dx:'+((Math.random()-.5)*140)+'px';
    box.appendChild(p);
  }
})();
</script>
